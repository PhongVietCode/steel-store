name: Keepalive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://steel-store-api.onrender.com/actuator/health"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            cat /tmp/body; echo
            if [ "$CODE" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          exit 1
