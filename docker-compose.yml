services:
  postgres:
    image: postgres:16
    container_name: steelstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: steelstore
      POSTGRES_PASSWORD: steelstore
      POSTGRES_DB: steelstore
    ports:
      - "5432:5432"
    volumes:
      - steelstore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steelstore -d steelstore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  steelstore-pgdata:
