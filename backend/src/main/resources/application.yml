spring:
  application:
    name: steel-store
  datasource:
    url: jdbc:postgresql://localhost:5432/steelstore
    username: steelstore
    password: steelstore
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 60
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # Dev default. Override via JWT_SECRET env var. Must be base64-encoded
  # 32+ bytes (256+ bits) for HS256.
  secret: ${JWT_SECRET:8hg89GAZRYrmUPqkiEMWGWj4WvsFnVj9AhWJTGdlEtI=}
  ttl: PT24H
  issuer: steel-store

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
