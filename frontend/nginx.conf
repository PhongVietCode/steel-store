server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # SPA fallback: send all non-file routes to the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service on the docker network.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long cache for hashed Vite assets; index.html stays revalidated.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache the entry doc — its <script> hashes change on each build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
